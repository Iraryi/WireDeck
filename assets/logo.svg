<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="WireDeck Logo">
  <!-- Classic flat hardware-inspired RJ45 Gigabit port badge -->
  <rect x="16" y="16" width="224" height="224" rx="40" fill="#24292F"/>
  <rect x="20" y="20" width="216" height="216" rx="36" fill="none" stroke="#3B434D" stroke-width="4"/>
  <!-- Outer RJ45 socket cavity -->
  <path d="M56 64 H200 V168 H164 V192 H92 V168 H56 Z" fill="#161B22" stroke="#D0D7DE" stroke-width="10" stroke-linejoin="round"/>
  <!-- 4 crisp gold metallic Ethernet contact pins -->
  <rect x="82" y="70" width="12" height="44" rx="3" fill="#E3B341"/>
  <rect x="108" y="70" width="12" height="44" rx="3" fill="#E3B341"/>
  <rect x="136" y="70" width="12" height="44" rx="3" fill="#E3B341"/>
  <rect x="162" y="70" width="12" height="44" rx="3" fill="#E3B341"/>
  <!-- Dual status LEDs (authentic RJ45 green link + amber activity) -->
  <rect x="52" y="182" width="24" height="14" rx="4" fill="#2DA44E"/>
  <rect x="180" y="182" width="24" height="14" rx="4" fill="#D29922"/>
</svg>
