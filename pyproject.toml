[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiredeck"
version = "0.2.1"
description = "Minimalist Windows laptop-to-console wired direct & 5 GHz wireless streaming assistant with 6-layer fault diagnosis, 4 languages, 5 device presets, and 20 AI/DSH toolkits."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pywebview>=5.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[project.scripts]
wiredeck-cli = "wiredeck.cli:main"
wiredeck = "wiredeck.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wiredeck = ["web/*", "toolkits/*", "toolkits/*/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
